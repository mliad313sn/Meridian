<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian PMO — multi-site project management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════
   MODERNIST — tokens carried over from the design system verbatim.
   Flat, architectural, Archivo throughout, one accent, zero radius.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#ec3013;
  --color-divider:rgba(32,30,29,.4);
  --rule-1:rgba(32,30,29,.22);
  --rule-2:rgba(32,30,29,.4);
  --muted:rgba(32,30,29,.55);
  --muted-2:rgba(32,30,29,.42);

  --color-neutral-100:#f8f4f4; --color-neutral-200:#eae7e7; --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6; --color-neutral-500:#9b9797; --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d; --color-neutral-800:#444141; --color-neutral-900:#2d2b2b;

  --color-accent-100:#fff2ef; --color-accent-200:#ffe0d9; --color-accent-300:#ffc4b8;
  --color-accent-400:#ff9783; --color-accent-500:#ff563c; --color-accent-600:#dd2b0f;
  --color-accent-700:#ae1800; --color-accent-800:#7c1405; --color-accent-900:#4d170e;

  --font-heading:"Archivo",system-ui,-apple-system,sans-serif;
  --font-body:"Archivo",system-ui,-apple-system,sans-serif;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-md:0px;
  --shadow-sm:0 1px 2px rgba(45,43,43,.14);
  --shadow-md:0 3px 10px rgba(45,43,43,.16);
  --shadow-lg:0 12px 32px rgba(45,43,43,.22);

  --sidebar:236px;
  --hdr:74px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--color-bg); color:var(--color-text);
  font-family:var(--font-body); font-size:14px; line-height:1.55; font-weight:400;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
h1,h2,h3,h4,h5{font-family:var(--font-heading);font-weight:800;line-height:1.12;letter-spacing:-.015em;margin:0}
h2{font-size:28px} h3{font-size:21px} h4{font-size:16px} h5{font-size:13px}
a{color:var(--color-accent);text-decoration:none}
a:hover{color:var(--color-accent-700);text-decoration:underline}
::selection{background:var(--color-accent-200);color:var(--color-text)}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--color-neutral-400)}
::-webkit-scrollbar-thumb:hover{background:var(--color-neutral-600)}
::-webkit-scrollbar-track{background:var(--color-surface)}

/* ── typographic utilities ────────────────────────────────────────── */
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kicker-lg{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.num{font-variant-numeric:tabular-nums;font-weight:800;font-family:var(--font-heading)}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.xs{font-size:10.5px}
.acc{color:var(--color-accent-700)}
.strong{font-weight:600}
.hr{border:0;border-top:2px solid var(--rule-2);margin:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flush{text-align:left}

/* ── app shell ────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sidebar);flex:none;border-right:2px solid var(--rule-2);
  display:flex;flex-direction:column;background:var(--color-bg);
}
.brand{padding:18px 18px 14px;border-bottom:2px solid var(--rule-2)}
.brand-row{display:flex;align-items:baseline;gap:8px}
.brand-mark{width:12px;height:12px;background:var(--color-accent);display:block;flex:none}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em;font-family:var(--font-heading)}
.nav{flex:1;overflow-y:auto;padding-bottom:12px}
.nav-group{padding:14px 18px 5px}
.nav-item{
  all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;
  padding:7px 18px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--color-neutral-200)}
.nav-item:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
.nav-item.on{background:var(--color-surface);font-weight:800;border-left-color:var(--color-accent)}
.nav-item .lbl{flex:1}
.nav-badge{font-size:11px;color:var(--color-accent-700);font-weight:600;font-variant-numeric:tabular-nums}
.who{border-top:2px solid var(--rule-2);padding:11px 18px;display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;background:var(--color-text);color:var(--color-bg);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:none;font-family:var(--font-heading)}
.avatar.sm{width:22px;height:22px;font-size:9.5px}
.avatar.ghost{background:var(--color-neutral-300);color:var(--color-text)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{flex:none;border-bottom:2px solid var(--rule-2);padding:14px 26px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.hdr-title{flex:1;min-width:200px}
.hdr-title h2{margin:3px 0 0;font-size:26px}
.hdr-actions{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.scroll{flex:1;overflow-y:auto;padding-bottom:56px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  .scroll{scroll-behavior:auto}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ── layout primitives ────────────────────────────────────────────── */
.sec{padding:22px 26px}
.sec-tight{padding:16px 26px}
.sec-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-hd h4{margin:0}
.sec-hd .sp{flex:1}
.split{display:grid;grid-template-columns:1fr 340px}
.split > .l{border-right:2px solid var(--rule-2);min-width:0}
.split-2{display:grid;grid-template-columns:1fr 1fr}
.split-2 > *:first-child{border-right:2px solid var(--rule-2)}
.split-3{display:grid;grid-template-columns:repeat(3,1fr)}
.split-3 > *{border-right:1px solid var(--rule-1)}
.split-3 > *:last-child{border-right:0}
.band{border-bottom:2px solid var(--rule-2)}
.band-1{border-bottom:1px solid var(--rule-1)}
.stack > * + *{margin-top:14px}

/* ── KPI strip ────────────────────────────────────────────────────── */
.kpis{display:grid;border-bottom:2px solid var(--rule-2)}
.kpi{padding:16px 22px;border-right:1px solid var(--rule-1);min-width:0}
.kpi:last-child{border-right:0}
.kpi-v{font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi-n{font-size:11px;color:var(--muted);margin-top:1px}

/* ── buttons ──────────────────────────────────────────────────────── */
.btn{
  font-family:var(--font-body);font-size:12.5px;font-weight:600;line-height:1;
  padding:9px 12px;border:2px solid var(--color-text);background:transparent;color:var(--color-text);
  cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:7px;border-radius:0;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.btn:hover{background:var(--color-accent-100);border-color:var(--color-accent)}
.btn:active{background:var(--color-accent-200)}
.btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.btn-primary:hover{background:var(--color-accent-600);border-color:var(--color-accent-600);color:#fff}
.btn-primary:active{background:var(--color-accent-700);border-color:var(--color-accent-700)}
.btn-ghost{border-color:transparent;padding:7px 9px}
.btn-ghost:hover{background:var(--color-accent-100);border-color:transparent}
.btn-sm{font-size:11px;padding:6px 9px}
.btn-xs{font-size:10.5px;padding:4px 7px;border-width:1.5px}
.btn-danger{border-color:var(--color-accent-700);color:var(--color-accent-700)}
.btn-danger:hover{background:var(--color-accent-700);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:transparent;border-color:var(--color-text)}
.btn-primary[disabled]:hover{background:var(--color-accent);border-color:var(--color-accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── tags ─────────────────────────────────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 6px;background:var(--color-neutral-200);white-space:nowrap}
.tag-accent{background:var(--color-accent);color:#fff}
.tag-soft{background:var(--color-accent-300)}
.tag-ink{background:var(--color-text);color:var(--color-bg)}
.tag-out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text)}
.dot{width:10px;height:10px;display:block;border:1.5px solid var(--color-text);flex:none}

/* ── forms ────────────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.input{
  font-family:var(--font-body);font-size:13px;padding:8px 10px;border:2px solid var(--color-text);
  background:var(--color-bg);color:var(--color-text);border-radius:0;width:100%;line-height:1.3;
}
.input:hover{border-color:var(--color-accent-600)}
.input:focus{outline:2px solid var(--color-accent);outline-offset:1px;border-color:var(--color-accent)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--color-text) 50%),linear-gradient(135deg,var(--color-text) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea.input{resize:vertical;min-height:70px;line-height:1.5}
.input-sm{font-size:12px;padding:5px 8px;border-width:1.5px}
.err{color:var(--color-accent-700);font-size:11px;font-weight:600}
.input.invalid{border-color:var(--color-accent);background:var(--color-accent-100)}
.checkline{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:6px 0}
.check{width:16px;height:16px;border:2px solid var(--color-text);flex:none;margin-top:2px;display:flex;
  align-items:center;justify-content:center;background:var(--color-bg)}
.check.on{background:var(--color-accent);border-color:var(--color-accent)}
.check.on::after{content:"";width:7px;height:3.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);margin-top:-2px}
.switch{width:38px;height:20px;border:2px solid var(--color-text);display:flex;align-items:center;padding:2px;cursor:pointer;flex:none;
  justify-content:flex-start;background:transparent;transition:background .15s ease}
.switch.on{background:var(--color-accent);border-color:var(--color-accent);justify-content:flex-end}
.knob{width:12px;height:12px;background:var(--color-text);display:block}
.switch.on .knob{background:#fff}
.seg{display:inline-flex;border:2px solid var(--color-text)}
.seg-opt{font-size:11px;font-weight:600;padding:6px 11px;cursor:pointer;border-right:1.5px solid var(--color-text);
  background:transparent;color:var(--color-text);font-family:var(--font-body);line-height:1.2}
.seg-opt:last-child{border-right:0}
.seg-opt:hover{background:var(--color-accent-100)}
.seg-opt.on{background:var(--color-accent);color:#fff}
.search{display:flex;align-items:center;gap:7px;border:2px solid var(--color-text);padding:0 9px;background:var(--color-bg)}
.search input{all:unset;font-family:var(--font-body);font-size:12.5px;padding:7px 0;width:100%}
.search svg{flex:none;opacity:.55}

/* ── tables ───────────────────────────────────────────────────────── */
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table thead tr{border-bottom:2px solid var(--rule-2);text-align:left}
.table th{padding:7px 8px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  color:var(--muted);white-space:nowrap;vertical-align:bottom}
.table th:first-child,.table td:first-child{padding-left:0}
.table th:last-child,.table td:last-child{padding-right:0}
.table td{padding:9px 8px;border-bottom:1px solid var(--rule-1);vertical-align:top}
.table tbody tr.click{cursor:pointer}
.table tbody tr.click:hover{background:var(--color-surface)}
.table tbody tr.sel{background:var(--color-surface);box-shadow:inset 3px 0 0 var(--color-accent)}
.table .r{text-align:right}
.table .c{text-align:center}
.table th.sortable{cursor:pointer;user-select:none}
.table th.sortable:hover{color:var(--color-accent-700)}
.table th .car{font-size:8px;margin-left:3px}
.table tfoot td{border-top:2px solid var(--rule-2);border-bottom:0;font-weight:800;padding-top:10px}
.tbl-wrap{overflow-x:auto}
.empty{padding:34px 8px;text-align:left;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--rule-1)}
.empty strong{display:block;font-size:14px;color:var(--color-text);margin-bottom:4px;font-family:var(--font-heading)}

/* ── bars & meters ────────────────────────────────────────────────── */
.meter{height:8px;background:var(--color-neutral-300);position:relative;overflow:hidden}
.meter > i{display:block;height:100%;background:var(--color-text)}
.meter.thin{height:5px}
.bar-lbl{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px;color:var(--muted)}
.mix{display:flex;height:9px;background:var(--color-neutral-200)}
.mix > i{display:block;height:100%}

/* ── cards ────────────────────────────────────────────────────────── */
.card{background:var(--color-surface);padding:13px 14px;border:0}
.card-kicker{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-title{font-family:var(--font-heading);font-weight:800;font-size:13.5px;line-height:1.25;margin:4px 0 3px}
.list-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-1)}
.list-row:last-child{border-bottom:0}
.mark{width:3px;flex:none;background:var(--color-text)}
.mark-acc{background:var(--color-accent)}

/* ── gantt ────────────────────────────────────────────────────────── */
.gantt{border:0;min-width:820px}
.gantt-hd{display:flex;border-bottom:2px solid var(--rule-2);position:sticky;top:0;background:var(--color-bg);z-index:3}
.gantt-name{width:250px;flex:none;padding:7px 10px 7px 0;border-right:2px solid var(--rule-2)}
.gantt-axis{flex:1;display:flex;position:relative}
.gantt-tick{flex:1;padding:7px 5px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-left:1px solid var(--rule-1);font-weight:600}
.gantt-row{display:flex;border-bottom:1px solid var(--rule-1);min-height:38px}
.gantt-row:hover{background:var(--color-neutral-100)}
.gantt-row.sel{background:var(--color-surface)}
.gantt-track{position:relative;flex:1;min-height:38px}
.gbar{position:absolute;top:9px;height:20px;display:flex;align-items:center;padding:0 6px;font-size:10.5px;
  font-weight:600;color:#fff;background:var(--color-text);cursor:grab;user-select:none;white-space:nowrap;overflow:hidden}
.gbar.crit{box-shadow:inset 0 -3px 0 var(--color-accent)}
.gbar.behind{background:var(--color-accent)}
.gbar.plan{background:var(--color-neutral-300);color:var(--color-text)}
.gbar.plan.crit{box-shadow:inset 0 -3px 0 var(--color-accent-400)}
.gbar.done{background:var(--color-text)}
.gbar.dragging{opacity:.75;cursor:grabbing;box-shadow:var(--shadow-md);z-index:5}
.gbar .grip{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.gbar .grip.l{left:0} .gbar .grip.r{right:0}
.gbar .prog{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);pointer-events:none}
.gbase{position:absolute;top:31px;height:3px;background:var(--color-neutral-400)}
.gmile{position:absolute;top:8px;width:14px;height:14px;background:var(--color-bg);border:2px solid var(--color-text);transform:rotate(45deg)}
.gmile.late{background:var(--color-accent);border-color:var(--color-accent)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--color-accent);z-index:2;pointer-events:none}
.ggate{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--muted-2);z-index:1;pointer-events:none}
.ggate span{position:absolute;top:2px;left:3px;font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.gdep{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}

/* ── kanban ───────────────────────────────────────────────────────── */
.board{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:0 26px 26px}
.col{flex:1;min-width:214px;border-right:1px solid var(--rule-1);padding:0 12px}
.col:first-child{padding-left:0}
.col:last-child{border-right:0;padding-right:0}
.col-hd{display:flex;align-items:baseline;gap:8px;padding:12px 0 9px;border-bottom:2px solid var(--rule-2);margin-bottom:10px;position:sticky;top:0;background:var(--color-bg);z-index:2}
.col-hd .n{flex:1;font-size:12px;font-weight:800;font-family:var(--font-heading);letter-spacing:-.01em}
.col.over{background:var(--color-accent-100)}
.kcard{background:var(--color-surface);padding:10px 11px;margin-bottom:8px;cursor:grab;border-left:3px solid var(--color-text);position:relative}
.kcard:hover{box-shadow:var(--shadow-sm)}
.kcard.p1{border-left-color:var(--color-accent)}
.kcard.p3{border-left-color:var(--color-neutral-400)}
.kcard.drag{opacity:.4}
.kcard-t{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:7px}
.kcard-m{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.kcard-m .sp{flex:1}
.wip-over{color:var(--color-accent-700);font-weight:800}

/* ── matrix / heatmap ─────────────────────────────────────────────── */
.grid-cell{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  aspect-ratio:1;border:1px solid var(--color-bg);cursor:pointer;font-variant-numeric:tabular-nums}
.grid-cell.head{background:transparent!important;color:var(--muted);cursor:default;font-weight:600;font-size:10px}
.grid-cell:not(.head):hover{outline:2px solid var(--color-text);outline-offset:-2px}
.heat{border-collapse:collapse;width:100%;font-size:11px}
.heat th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 4px;font-weight:600;text-align:center}
.heat th.n{text-align:left;width:170px}
.heat td{padding:0;border:1px solid var(--color-bg)}
.heat td.n{padding:5px 8px 5px 0;border:0;border-bottom:1px solid var(--rule-1);white-space:nowrap}
.heat-c{padding:7px 2px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.heat-c:hover{outline:2px solid var(--color-text);outline-offset:-2px}

/* ── steps / workflow ─────────────────────────────────────────────── */
.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-1)}
.step-i{width:20px;height:20px;flex:none;border:2px solid var(--color-text);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;font-family:var(--font-heading)}
.step-i.ok{background:var(--color-text);color:var(--color-bg)}
.step-i.no{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.step-i.wait{color:var(--muted);border-color:var(--muted-2)}

/* ── modal ────────────────────────────────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(32,30,29,.55);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 20px 20px;z-index:60;overflow-y:auto}
.dialog{background:var(--color-bg);width:100%;max-width:620px;box-shadow:var(--shadow-lg);border:2px solid var(--color-text)}
.dialog.wide{max-width:900px}
.dialog-hd{padding:16px 20px;border-bottom:2px solid var(--rule-2);display:flex;align-items:flex-start;gap:12px}
.dialog-hd .sp{flex:1;min-width:0}
.dialog-bd{padding:18px 20px;max-height:64vh;overflow-y:auto}
.dialog-ft{padding:13px 20px;border-top:2px solid var(--rule-2);display:flex;gap:8px;align-items:center}
.dialog-ft .sp{flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}

/* ── toast ────────────────────────────────────────────────────────── */
.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--color-text);color:var(--color-bg);padding:11px 14px;font-size:12.5px;
  box-shadow:var(--shadow-md);display:flex;gap:10px;align-items:flex-start;animation:tin .18s ease}
.toast.warn{background:var(--color-accent);color:#fff}
.toast b{font-family:var(--font-heading);font-weight:800}
@keyframes tin{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* ── command palette ──────────────────────────────────────────────── */
.cmd{background:var(--color-bg);width:100%;max-width:560px;border:2px solid var(--color-text);box-shadow:var(--shadow-lg)}
.cmd-in{all:unset;display:block;width:100%;padding:15px 18px;font-family:var(--font-heading);font-size:19px;font-weight:800;
  border-bottom:2px solid var(--rule-2);box-sizing:border-box}
.cmd-list{max-height:52vh;overflow-y:auto}
.cmd-item{display:flex;gap:11px;align-items:center;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--rule-1)}
.cmd-item.on{background:var(--color-surface);box-shadow:inset 3px 0 0 var(--color-accent)}
.cmd-item .sp{flex:1;min-width:0}

/* ── misc ─────────────────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 8px;border:1.5px solid var(--rule-2);cursor:pointer;background:transparent;font-family:var(--font-body)}
.chip:hover{border-color:var(--color-accent);background:var(--color-accent-100)}
.chip.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.poster{background:var(--color-accent);color:#fff;padding:26px}
.poster h3{font-size:26px;letter-spacing:-.02em}
.audit{font-size:11.5px;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-1)}
.audit time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;width:104px;flex:none}
.clock{font-variant-numeric:tabular-nums;font-family:var(--font-heading);font-weight:800}
.sparkline{display:block}
.drop-hint{border:2px dashed var(--muted-2);padding:14px;text-align:left;color:var(--muted);font-size:11.5px}
.linkish{cursor:pointer}
.linkish .strong,.linkish>a{text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.linkish:hover{background:var(--color-neutral-100)}
.linkish:hover .strong{color:var(--color-accent-700)}
.bare{all:unset;cursor:pointer}
.pill-n{font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}
.nowrap{white-space:nowrap}

/* ── print (status report) ────────────────────────────────────────── */
@media print{
  body{overflow:visible}
  .sidebar,.hdr,.no-print{display:none!important}
  .app,.main,.scroll{display:block;height:auto;overflow:visible}
  .print-only{display:block!important}
}
.print-only{display:none}

/* ── responsive ───────────────────────────────────────────────────── */
@media (max-width:1180px){
  .split{grid-template-columns:1fr}
  .split > .l{border-right:0;border-bottom:2px solid var(--rule-2)}
}
@media (max-width:900px){
  :root{--sidebar:0px}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:50;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex!important}
  .split-2,.split-3{grid-template-columns:1fr}
  .split-2 > *:first-child,.split-3 > *{border-right:0;border-bottom:2px solid var(--rule-2)}
  .sec{padding:18px}
  .board{padding:0 18px 18px}
}
@media (max-width:760px){
  .kpis{grid-template-columns:1fr 1fr!important}
  .kpi{border-bottom:1px solid var(--rule-1)}
  .kpi .v{font-size:24px}
  .hdr{flex-wrap:wrap;row-gap:12px}
  .hdr-title{width:100%;order:-1}
  .hdr-actions{width:100%;flex-wrap:wrap}
  .hdr-actions .field{flex:1 1 42%;min-width:0}
  .hdr-actions .search{flex:1 1 100%}
  .rail{min-width:0}
}
.menu-btn{display:none}

/** Expand a project's WBS template into dated, dependency-linked activities. */
function genActivities(p, today) {
  const tpl = WBS[p.method];
  const span = days(p.start, p.finish);
  const r = rng(hashCode(p.id));
  return tpl.map((t, i) => {
    const jitter = (r() - 0.5) * 0.02;
    const start = addDays(p.start, Math.round((t.off + jitter) * span));
    const end = addDays(p.start, Math.round((t.off + t.dur + jitter) * span));
    const bStart = addDays(p.start, Math.round(t.off * span));
    const bEnd = addDays(p.start, Math.round((t.off + t.dur) * span));
    // planned progress by today, then bent by the project's schedule performance
    const planned = clamp(days(start, today) / Math.max(1, days(start, end)), 0, 1);
    let actual = planned <= 0 ? 0 : clamp(planned * (p.perf.sched + (r() - 0.5) * 0.09), 0, 1);
    if (planned >= 1 && p.perf.sched >= 1) actual = 1;
    if (planned >= 1 && actual > 0.97) actual = 1;
    return {
      id: p.id + "-A" + (i + 1), project: p.id, name: t.n, stage: i,
      start: iso(start), end: iso(end), baseStart: iso(bStart), baseEnd: iso(bEnd),
      weight: t.w, pct: Math.round(actual * 100), deps: t.dep.map(d => p.id + "-A" + (d + 1)),
      owner: p.pm,
    };
  });
}

/** Gate milestones + hand-placed ones, dated across the project window. */
function genMilestones(p) {
  const span = days(p.start, p.finish);
  const gates = GATES.map(g => ({
    id: p.id + "-G" + g.n, project: p.id, name: g.name, gate: g.n,
    date: iso(addDays(p.start, Math.round(g.at * span))),
    baseDate: iso(addDays(p.start, Math.round(g.at * span))),
    owner: p.pm, kind: "gate",
  }));
  const extra = SEED_MILESTONES.filter(m => m.project === p.id).map((m, i) => ({
    id: p.id + "-M" + (i + 1), project: p.id, name: m.name, gate: null,
    date: m.date, baseDate: m.date, owner: m.owner, kind: "milestone",
  }));
  return gates.concat(extra).sort(by("date"));
}

/**
 * Monthly cost ledger, shaped as an S-curve and then scaled so the cost
 * performance index lands where the project's profile says it should.
 * It is calibrated against the *same* earned value the engine computes —
 * the activity-weight sum — so seed and engine cannot drift apart.
 */
function genLedger(p, activities, today) {
  const out = [];
  const r = rng(hashCode(p.id) + 7);
  const span = days(p.start, p.finish);
  let m = D(monthKey(p.start) + "-01");
  const stop = D(monthKey(today) + "-01");
  const scurve = (x) => 1 / (1 + Math.exp(-9 * (x - 0.5)));
  let raw = 0;
  while (m <= stop) {
    const t0 = clamp(days(p.start, m) / span, 0, 1);
    const t1 = clamp(days(p.start, addMonths(m, 1)) / span, 0, 1);
    const share = (scurve(t1) - scurve(t0)) / (scurve(1) - scurve(0));
    let amount = p.budget * share * (1 + (r() - 0.5) * 0.12);
    if (monthKey(m) === monthKey(today)) amount *= D(today).getUTCDate() / 30;
    if (amount > 0.0005) { out.push({ project: p.id, period: monthKey(m), amount }); raw += amount; }
    m = addMonths(m, 1);
  }
  const ev = sum(activities, a => a.weight * (a.pct / 100) * p.budget);
  const targetAC = p.perf.cost > 0 ? ev / p.perf.cost : raw;
  const factor = raw > 0 && targetAC > 0 ? targetAC / raw : 1;
  return out.map(e => ({ project: e.project, period: e.period, amount: +(e.amount * factor).toFixed(4) }))
    .filter(e => e.amount > 0);
}

/** Allocate the delivery team across each project's window. */
/* Role slots per delivery method: which discipline, how much of a week it
   wants, and the slice of the project window it is needed for. */
const SLOTS = {
  Waterfall: [
    ["architect", 60, .02, .55], ["Delivery lead|Engineering manager", 80, .10, .92],
    ["Business analyst", 70, .05, .62], ["QA lead", 70, .40, .98], ["Change manager", 50, .55, 1],
  ],
  Agile: [
    ["Product owner", 60, .05, .95], ["architect", 60, .02, .50],
    ["Delivery lead|Engineering manager", 80, .12, .95], ["QA lead", 60, .35, .98], ["UX lead", 50, .05, .48],
  ],
  Hybrid: [
    ["architect", 60, .02, .55], ["Delivery lead|Engineering manager", 80, .10, .90],
    ["Data lead|Data engineer", 60, .15, .80], ["QA lead", 60, .40, .95],
    ["Release manager", 40, .70, 1], ["Operations lead", 40, .72, 1],
  ],
};

/* People deliberately pushed past their ceiling, so the capacity view has a
   real problem to find rather than a synthetic one. */
const OVERBOOKED = ["PE-09", "PE-11", "PE-06", "PE-26"];

/**
 * Allocations that respect capacity. A person is only put on a project if
 * they have room across every week of the window, so utilisation lands
 * where it should and over-allocation means something when it appears.
 */
function genAllocations(projects, today) {
  const out = [];
  const grid = new Map();                       // person → week index → committed %
  const wk = (d) => Math.floor(days("2025-01-01", d) / 7);
  const peak = (pid, from, to) => {
    const g = grid.get(pid); if (!g) return 0;
    let mx = 0;
    for (let w = wk(from); w <= wk(to); w++) mx = Math.max(mx, g.get(w) || 0);
    return mx;
  };
  const add = (pid, projectId, from, to, pct) => {
    out.push({ id: uid(), person: pid, project: projectId, pct, from, to });
    let g = grid.get(pid); if (!g) { g = new Map(); grid.set(pid, g); }
    for (let w = wk(from); w <= wk(to); w++) g.set(w, (g.get(w) || 0) + pct);
  };
  const win = (p, a, b) => {
    const span = days(p.start, p.finish);
    return [addDays(p.start, Math.round(span * a)), addDays(p.start, Math.round(span * b))];
  };

  const pms = projects.map(p => p.pm);
  // project managers first — they own their project end to end
  projects.forEach(p => add(p.pm, p.id, p.start, p.finish, 100));

  // programme managers take a slice of each project in their programme
  projects.forEach(p => {
    const prog = PROGRAMMES.find(x => x.id === p.programme);
    if (prog && prog.managerId && prog.managerId !== p.pm
        && peak(prog.managerId, p.start, p.finish) <= 80) add(prog.managerId, p.id, p.start, p.finish, 20);
  });

  // then the delivery roles, cheapest-loaded and closest-to-site first
  projects.forEach(p => {
    (SLOTS[p.method] || SLOTS.Hybrid).forEach(([role, want, a, b]) => {
      const [from, to] = win(p, a, b);
      const re = new RegExp(role, "i");
      const cands = PEOPLE
        .filter(x => re.test(x.role) && x.id !== p.pm && !pms.includes(x.id))
        .map(x => ({ x, load: peak(x.id, from, to), local: x.site === p.site ? 0 : 1 }))
        .sort((m, n) => m.load - n.load || m.local - n.local);
      const pick = cands.find(c => c.load <= 100 - 20);
      if (!pick) return;
      const pct = Math.min(want, Math.floor((100 - pick.load) / 10) * 10);
      if (pct >= 20) add(pick.x.id, p.id, from, to, pct);
    });
  });

  // and the deliberate pressure points
  OVERBOOKED.forEach((pid, i) => {
    const theirs = out.filter(a => a.person === pid);
    if (!theirs.length) return;
    const from = addDays(today, -7 * (i % 3));
    add(pid, theirs[theirs.length - 1].project, from, addDays(from, 55), 30 + i * 10);
  });

  return out;
}

function hashCode(str) { let hHash = 0; for (let i = 0; i < str.length; i++) { hHash = (hHash * 31 + str.charCodeAt(i)) | 0; } return Math.abs(hHash) || 1; }

/** Build the whole database from the reference data above. */
function buildSeed() {
  const today = iso(new Date());
  const projects = PROJECTS.map(p => ({
    id: p.id, name: p.name, programme: p.prog, site: p.site, pm: p.pm, method: p.method,
    start: p.start, finish: p.finish, baselineFinish: p.baseline, budget: p.budget,
    contingency: p.contingency, contingencyUsed: +(p.contingency * (p.perf.cost < 0.95 ? 0.42 : p.perf.cost < 1.0 ? 0.18 : 0.05)).toFixed(3), desc: p.desc, perf: p.perf,
    phase: phaseFor(p, today), healthOverride: null, gate: 0, closed: false,
  }));
  const activities = [], milestones = [], ledger = [];
  projects.forEach(p => {
    const acts = genActivities(p, today);
    activities.push(...acts);
    milestones.push(...genMilestones(p));
    ledger.push(...genLedger(p, acts, today));
  });

  const docs = SEED_DOCS.map((d, i) => ({ id: "DOC-" + (101 + i), ...d }));
  // give every project a full gate-evidence set so gate locking has something to read
  let dn = 101 + SEED_DOCS.length;
  projects.forEach(p => {
    GATES.forEach(g => {
      const has = docs.some(d => d.project === p.id && d.gate === g.n);
      if (has) return;
      const span = days(p.start, p.finish);
      const due = addDays(p.start, Math.round(g.at * span));
      const late = D(due) > D(today);
      docs.push({
        id: "DOC-" + (dn++), name: g.evidence.split(",")[0] + " — " + p.id,
        project: p.id, type: g.n === 1 ? "Charter" : g.n === 4 ? "Closure" : g.n === 2 ? "Design" : "Assurance",
        gate: g.n, owner: p.pm, rev: late ? "0.1" : "1.0",
        status: late ? "Draft" : "Approved", updated: iso(late ? today : addDays(due, -6)),
      });
    });
  });

  const items = SEED_ITEMS.map(([project, col, title, assignee, points, priority], i) => ({
    id: "WI-" + (300 + i), project, column: col, title, assignee, points, priority,
    created: iso(addDays(today, -40 + (i % 30))),
  }));

  const crs = SEED_CRS.map(c => ({
    ...c,
    steps: CR_STEPS.map((st, i) => ({
      role: st.role, note: st.note,
      state: c.status === "Rejected" && i === c.stage ? "rejected" : i < c.stage ? "done" : i === c.stage ? "current" : "waiting",
      when: i < c.stage ? iso(addDays(c.raised, i * 3)) : null,
    })),
    applied: c.status === "Approved",
  }));

  const raid = SEED_RAID.map(r => ({ ...r }));

  return {
    version: 4, orgName: "MERIDIAN", statusDate: today, currentUser: "PE-14",
    sites: deepClone(SITES), programmes: deepClone(PROGRAMMES), people: deepClone(PEOPLE),
    projects, activities, milestones, ledger, raid, crs, docs, items,
    allocations: genAllocations(projects, today),
    columns: deepClone(COLUMNS),
    settings: {
      autoRag: true, gateLock: true, ccb: true, capacityAlerts: true, benefitTrack: true,
      ccbThreshold: 0.25, ccbWeeks: 2, amberSpi: 0.95, redSpi: 0.90, amberCpi: 0.95, redCpi: 0.90,
      escalateExposure: 15, pmoExposure: 8, issueAgeDays: 10, capacityCeiling: 100,
      cadence: "Weekly — Monday 09:00",
    },
    narrative: {},
    audit: [{ id: uid(), at: new Date().toISOString(), who: "PE-14", what: "Portfolio book opened", detail: PROJECTS.length + " projects across " + SITES.length + " sites" }],
  };
}

function phaseFor(p, today) {
  const t = clamp(days(p.start, today) / days(p.start, p.finish), 0, 1);
  if (t <= 0) return "Initiation";
  if (t < 0.10) return "Initiation";
  if (t < 0.22) return "Design";
  if (t < 0.82) return "Execution";
  if (t < 0.94) return "Transition";
  return "Closure";
}
/* ═══════════════════════════════════════════════════════════════════
   3 · ENGINE — every number in the interface is derived here. Nothing
   downstream stores a metric; views ask the engine and render the answer.
   ═══════════════════════════════════════════════════════════════════ */

const Engine = {

  /* ── lookups ────────────────────────────────────────────────────── */
  person: (db, id) => db.people.find(p => p.id === id) || null,
  personName: (db, id) => (db.people.find(p => p.id === id) || {}).name || "—",
  project: (db, id) => db.projects.find(p => p.id === id) || null,
  site: (db, id) => db.sites.find(s => s.id === id) || null,
  programme: (db, id) => db.programmes.find(p => p.id === id) || null,
  activities: (db, id) => db.activities.filter(a => a.project === id).sort(by("start")),
  milestones: (db, id) => db.milestones.filter(m => m.project === id).sort(by("date")),

  /* ── earned value ───────────────────────────────────────────────── */
  /**
   * Planned value uses each activity's baseline window; earned value uses the
   * activity's reported progress; actual cost comes from the ledger. Anything
   * with no activities (a project still in mandate) reports a flat zero rather
   * than dividing by nothing.
   */
  metrics(db, projectId) {
    const p = Engine.project(db, projectId);
    if (!p) return null;
    const today = db.statusDate;
    const acts = Engine.activities(db, projectId);
    const bac = p.budget;

    let pv = 0, ev = 0;
    acts.forEach(a => {
      const plannedSpan = Math.max(1, days(a.baseStart, a.baseEnd));
      const plannedPct = clamp(days(a.baseStart, today) / plannedSpan, 0, 1);
      pv += a.weight * plannedPct * bac;
      ev += a.weight * (a.pct / 100) * bac;
    });
    const ac = sum(db.ledger.filter(l => l.project === projectId), l => l.amount);

    /* Below a couple of per cent elapsed the indices are arithmetic noise —
       a fortnight's spend divided by a fortnight's plan. Real PMOs don't
       report an index that early, so neither does this. */
    const measurable = pv >= bac * 0.02 && ac >= bac * 0.005;
    const spi = !measurable ? 1 : pv > 0.0001 ? ev / pv : 1;
    const cpi = !measurable ? 1 : ac > 0.0001 ? ev / ac : 1;
    const sv = ev - pv, cv = ev - ac;
    const eac = cpi > 0.01 ? bac / cpi : bac;
    const vac = bac - eac;
    const tcpi = (bac - ac) > 0.0001 ? (bac - ev) / (bac - ac) : 1;
    const pctComplete = bac > 0 ? clamp(ev / bac, 0, 1) : 0;
    const plannedComplete = bac > 0 ? clamp(pv / bac, 0, 1) : 0;

    // forecast finish: stretch the remaining window by the schedule index
    const totalSpan = days(p.start, p.finish);
    const elapsed = clamp(days(p.start, today), 0, totalSpan);
    const remaining = Math.max(0, totalSpan - elapsed);
    const forecastFinish = iso(addDays(today, spi > 0.05 ? Math.round(remaining / spi) : remaining));
    const slipDays = days(p.finish, forecastFinish);

    const health = Engine.health(db, p, { spi, cpi, measurable });
    return {
      project: p, bac, pv, ev, ac, spi, cpi, sv, cv, eac, vac, tcpi, measurable,
      pctComplete, plannedComplete, forecastFinish, slipDays, health,
      contingencyLeft: p.contingency - p.contingencyUsed,
      contingencyPct: p.contingency > 0 ? p.contingencyUsed / p.contingency : 0,
    };
  },

  /** RAG, either derived from the indices or set by hand when the PM overrides. */
  health(db, p, m) {
    if (p.healthOverride) return { rag: p.healthOverride, derived: false, why: "Set by the project manager" };
    const st = db.settings;
    if (!st.autoRag) return { rag: "G", derived: false, why: "Automatic status is off — PM judgement applies" };
    if (m.measurable === false) return { rag: "G", derived: true, why: "Too early to measure — less than 2% of the plan has been spent" };
    const s = m.spi, c = m.cpi;
    if (s < st.redSpi || c < st.redCpi)
      return { rag: "R", derived: true, why: "SPI " + idx(s) + " / CPI " + idx(c) + " — below the red threshold of " + idx(st.redSpi) };
    if (s < st.amberSpi || c < st.amberCpi)
      return { rag: "A", derived: true, why: "SPI " + idx(s) + " / CPI " + idx(c) + " — below the amber threshold of " + idx(st.amberSpi) };
    return { rag: "G", derived: true, why: "SPI " + idx(s) + " and CPI " + idx(c) + " both inside tolerance" };
  },

  /** Portfolio roll-up over whatever set of projects the view is scoped to. */
  roll(db, projects) {
    const ms = projects.map(p => Engine.metrics(db, p.id)).filter(Boolean);
    const bac = sum(ms, m => m.bac), pv = sum(ms, m => m.pv), ev = sum(ms, m => m.ev), ac = sum(ms, m => m.ac);
    const live = ms.filter(m => m.measurable);
    const lpv = sum(live, m => m.pv), lev = sum(live, m => m.ev), lac = sum(live, m => m.ac);
    const spi = lpv > 0.0001 ? lev / lpv : 1, cpi = lac > 0.0001 ? lev / lac : 1;
    const eac = sum(ms, m => m.eac);
    return {
      count: ms.length, bac, pv, ev, ac, spi, cpi, eac, vac: bac - eac, cv: ev - ac, sv: ev - pv,
      measured: live.length,
      green: ms.filter(m => m.health.rag === "G").length,
      amber: ms.filter(m => m.health.rag === "A").length,
      red: ms.filter(m => m.health.rag === "R").length,
      metrics: ms,
    };
  },

  /* ── critical path (forward/backward pass over finish-start links) ─ */
  criticalPath(db, projectId) {
    const acts = Engine.activities(db, projectId);
    const byId = Object.fromEntries(acts.map(a => [a.id, a]));
    const es = {}, ef = {}, ls = {}, lf = {};
    const dur = a => Math.max(1, days(a.start, a.end));
    const origin = acts.length ? Math.min(...acts.map(a => D(a.start).getTime())) : 0;
    const toDay = t => Math.round((t - origin) / DAY);

    const order = Engine.topo(acts);
    order.forEach(a => {
      const preds = a.deps.map(d => byId[d]).filter(Boolean);
      es[a.id] = preds.length ? Math.max(...preds.map(p => ef[p.id])) : toDay(D(a.start).getTime());
      ef[a.id] = es[a.id] + dur(a);
    });
    const projEnd = acts.length ? Math.max(...acts.map(a => ef[a.id])) : 0;
    [...order].reverse().forEach(a => {
      const succs = acts.filter(x => x.deps.includes(a.id));
      lf[a.id] = succs.length ? Math.min(...succs.map(s => ls[s.id])) : projEnd;
      ls[a.id] = lf[a.id] - dur(a);
    });
    const float = {}; acts.forEach(a => { float[a.id] = ls[a.id] - es[a.id]; });
    return { critical: new Set(acts.filter(a => float[a.id] <= 0).map(a => a.id)), float, projEnd, es, ef, ls, lf };
  },

  topo(acts) {
    const byId = Object.fromEntries(acts.map(a => [a.id, a]));
    const seen = new Set(), out = [];
    const visit = (a) => {
      if (!a || seen.has(a.id)) return;
      seen.add(a.id);
      a.deps.forEach(d => visit(byId[d]));
      out.push(a);
    };
    acts.forEach(visit);
    return out;
  },

  /** A dependency is breached when a successor starts before its predecessor ends. */
  /**
   * Stages routinely overlap by design — that is fast-tracking, not a breach.
   * What matters is an overlap deeper than the one the baseline agreed to,
   * which is what a schedule edit can create.
   */
  depBreaches(db, projectId) {
    const acts = Engine.activities(db, projectId);
    const byId = Object.fromEntries(acts.map(a => [a.id, a]));
    const out = [];
    acts.forEach(a => a.deps.forEach(d => {
      const pre = byId[d];
      if (!pre) return;
      const now = days(pre.end, a.start);
      const agreed = (pre.baseEnd && a.baseStart) ? days(pre.baseEnd, a.baseStart) : 0;
      /* Five days of tolerance: re-planning nudges dates around, and only a
         meaningful bite out of the agreed lead is worth raising. */
      if (now < Math.min(0, agreed) - 5)
        out.push({ activity: a, predecessor: pre, overlap: -now, agreed: -Math.min(0, agreed) });
    }));
    return out;
  },

  /* ── gates ──────────────────────────────────────────────────────── */
  gateStatus(db, projectId, gateN) {
    const docs = db.docs.filter(d => d.project === projectId && d.gate === gateN);
    const approved = docs.filter(d => d.status === "Approved").length;
    const ms = db.milestones.find(m => m.project === projectId && m.gate === gateN);
    const date = ms ? ms.date : null;
    const passed = date ? D(date) <= D(db.statusDate) : false;
    return {
      gate: gateN, date, docs, approved, total: docs.length,
      ready: docs.length > 0 && approved === docs.length,
      outstanding: docs.filter(d => d.status !== "Approved"),
      state: passed && approved === docs.length ? "Cleared"
           : passed ? "Overdue"
           : date && days(db.statusDate, date) <= 45 ? (approved === docs.length ? "Ready" : "At risk")
           : "Planned",
    };
  },

  /** Which gate the project is working toward right now. */
  currentGate(db, projectId) {
    for (const g of GATES) {
      const st = Engine.gateStatus(db, projectId, g.n);
      if (st.state !== "Cleared") return { ...g, ...st };
    }
    return { ...GATES[3], ...Engine.gateStatus(db, projectId, 4) };
  },

  /** Gate locking, when switched on, blocks a phase advance on missing evidence. */
  canAdvance(db, projectId) {
    if (!db.settings.gateLock) return { ok: true, reason: "Gate locking is off" };
    const g = Engine.currentGate(db, projectId);
    if (g.state === "Cleared" || g.ready) return { ok: true, reason: "Evidence complete for " + g.name };
    return { ok: false, reason: g.outstanding.length + " evidence item" + (g.outstanding.length === 1 ? "" : "s") + " outstanding for " + g.name, items: g.outstanding };
  },

  /* ── RAID ───────────────────────────────────────────────────────── */
  exposure: (r) => r.p * r.i,
  exposureBand(r) {
    const e = Engine.exposure(r);
    return e >= 15 ? "Critical" : e >= 9 ? "High" : e >= 4 ? "Medium" : "Low";
  },
  /** Where an item has to be heard, from the thresholds in administration. */
  escalation(db, r) {
    const st = db.settings, e = Engine.exposure(r);
    const age = days(r.opened, db.statusDate);
    if (r.status === "Closed") return { level: "Closed", why: "Closed" };
    if (e >= st.escalateExposure) return { level: "Steering", why: "Exposure " + e + " at or above " + st.escalateExposure };
    if (r.type === "Issue" && age > st.issueAgeDays) return { level: "PMO", why: "Issue open " + age + " days" };
    if (e >= st.pmoExposure) return { level: "PMO", why: "Exposure " + e + " at or above " + st.pmoExposure };
    return { level: "Project", why: "Inside project tolerance" };
  },
  openRaid: (db, projectId) => db.raid.filter(r => r.status === "Open" && (!projectId || r.project === projectId)),

  /* ── change control ─────────────────────────────────────────────── */
  /** The routing rule from administration decides who has to sign a CR off. */
  route(db, cr) {
    const st = db.settings;
    if (!st.ccb) return { authority: "Project manager", why: "Change control board is off" };
    const big = Math.abs(cr.cost) >= st.ccbThreshold || Math.abs(cr.weeks) >= st.ccbWeeks;
    return big
      ? { authority: "Steering committee", why: cash(cr.cost) + " / " + cr.weeks + " wk exceeds the " + cash(st.ccbThreshold) + " or " + st.ccbWeeks + "-week threshold" }
      : { authority: "Change authority", why: "Below the steering committee threshold" };
  },
  crStage: (cr) => cr.steps.findIndex(s => s.state === "current"),

  /* ── capacity ───────────────────────────────────────────────────── */
  /** Week-by-week allocation per person, from the allocation records. */
  capacity(db, weeks, fromDate) {
    const start = startOfWeek(fromDate || db.statusDate);
    const cols = Array.from({ length: weeks }, (_, i) => addDays(start, i * 7));
    const rows = db.people.map(person => {
      const allocs = db.allocations.filter(a => a.person === person.id);
      const cells = cols.map(w => {
        const wEnd = addDays(w, 7);
        const load = sum(allocs.filter(a => D(a.from) < wEnd && D(a.to) >= w), a => a.pct);
        return { week: iso(w), load, projects: allocs.filter(a => D(a.from) < wEnd && D(a.to) >= w).map(a => a.project) };
      });
      return { person, cells, peak: Math.max(0, ...cells.map(c => c.load)), avg: Math.round(sum(cells, c => c.load) / cols.length) };
    });
    return { cols, rows };
  },
  /** People above the ceiling for two or more consecutive weeks. */
  overAllocated(db, weeks) {
    const cap = Engine.capacity(db, weeks || 8);
    return cap.rows.filter(r => {
      let run = 0;
      for (const c of r.cells) { run = c.load > db.settings.capacityCeiling ? run + 1 : 0; if (run >= 2) return true; }
      return false;
    });
  },
  bench(db, weeks) {
    const cap = Engine.capacity(db, weeks || 8);
    return sum(cap.rows, r => Math.max(0, 100 - r.cells[0].load)) / 100;
  },

  /* ── sites ──────────────────────────────────────────────────────── */
  siteRollup(db) {
    return db.sites.map(site => {
      const projects = db.projects.filter(p => p.site === site.id);
      const people = db.people.filter(p => p.site === site.id);
      const cap = Engine.capacity(db, 4);
      const rows = cap.rows.filter(r => r.person.site === site.id);
      const util = rows.length ? Math.round(sum(rows, r => r.avg) / rows.length) : 0;
      const roll = Engine.roll(db, projects);
      return { site, projects, people, util, roll, load: sum(projects, p => p.budget) };
    });
  },

  /** Working-hours overlap between two sites, for follow-the-sun planning. */
  overlapHours(a, b) {
    // each site works 09:00–17:30 local
    const aStart = 9 - a.tz, aEnd = 17.5 - a.tz;   // in UTC
    const bStart = 9 - b.tz, bEnd = 17.5 - b.tz;
    return Math.max(0, Math.min(aEnd, bEnd) - Math.max(aStart, bStart));
  },
  siteClock(site, now) {
    const utc = (now || new Date()).getTime() + (now || new Date()).getTimezoneOffset() * 60000;
    const t = new Date(utc + site.tz * 3600000);
    return String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  },

  /* ── board ──────────────────────────────────────────────────────── */
  columnItems: (db, projectIds, colId, filter) => db.items.filter(i =>
    i.column === colId &&
    (!projectIds || projectIds.includes(i.project)) &&
    (!filter || !filter.assignee || i.assignee === filter.assignee)),

  /* ── decisions the portfolio owes an answer to ──────────────────── */
  decisions(db) {
    const out = [];
    db.crs.filter(c => c.status === "Pending").forEach(c => {
      const r = Engine.route(db, c);
      out.push({ kind: "Change request", title: c.id + " · " + c.title, meta: cash(c.cost) + " · " + r.authority, urgent: true, go: () => go("#/change/" + c.id) });
    });
    db.raid.filter(r => r.status === "Open" && Engine.escalation(db, r).level === "Steering").forEach(r => {
      out.push({ kind: "Escalated " + r.type.toLowerCase(), title: r.id + " · " + r.title, meta: "Exposure " + Engine.exposure(r) + " · " + (r.project || "Portfolio-wide"), urgent: true, go: () => go("#/risk/" + r.id) });
    });
    db.projects.forEach(p => {
      const g = Engine.currentGate(db, p.id);
      if (g.state === "At risk" || g.state === "Overdue")
        out.push({ kind: "Gate review", title: g.name + " · " + p.name, meta: g.outstanding.length + " evidence items outstanding", urgent: g.state === "Overdue", go: () => go("#/project/" + p.id) });
    });
    if (db.settings.capacityAlerts) {
      const over = Engine.overAllocated(db, 8);
      if (over.length) out.push({ kind: "Resourcing", title: over.length + " people above " + db.settings.capacityCeiling + "% for two weeks or more", meta: over.slice(0, 3).map(o => o.person.name).join(", "), urgent: false, go: () => go("#/resources") });
    }
    return out;
  },

  /** The next dated things across the whole book. */
  horizon(db, n) {
    const today = db.statusDate;
    return db.milestones
      .filter(m => D(m.date) >= D(today))
      .sort(by("date"))
      .slice(0, n || 6)
      .map(m => ({ ...m, projectName: (Engine.project(db, m.project) || {}).name || "Portfolio" }));
  },

  /** Portfolio spend curve by month: planned, earned and actual. */
  curve(db, projects) {
    const ids = projects.map(p => p.id);
    const acts = db.activities.filter(a => ids.includes(a.project));
    if (!acts.length) return [];
    const from = monthKey(projects.reduce((a, p) => D(p.start) < D(a) ? p.start : a, projects[0].start));
    const to = monthKey(projects.reduce((a, p) => D(p.finish) > D(a) ? p.finish : a, projects[0].finish));
    const out = [];
    let m = D(from + "-01"); const stop = D(to + "-01");
    const bacOf = Object.fromEntries(projects.map(p => [p.id, p.budget]));
    while (m <= stop) {
      const at = iso(addMonths(m, 1));
      let pv = 0, ev = 0;
      acts.forEach(a => {
        const span = Math.max(1, days(a.baseStart, a.baseEnd));
        pv += a.weight * clamp(days(a.baseStart, at) / span, 0, 1) * bacOf[a.project];
        const rs = Math.max(1, days(a.start, a.end));
        const done = clamp(days(a.start, at) / rs, 0, 1) * (a.pct / 100) / Math.max(0.01, clamp(days(a.start, db.statusDate) / rs, 0.01, 1));
        ev += a.weight * clamp(done, 0, a.pct / 100) * bacOf[a.project];
      });
      const ac = sum(db.ledger.filter(l => ids.includes(l.project) && l.period <= monthKey(m)), l => l.amount);
      out.push({ period: monthKey(m), pv, ev: D(at) <= D(db.statusDate) ? ev : null, ac: D(m) <= D(db.statusDate) ? ac : null });
      m = addMonths(m, 1);
    }
    return out;
  },
};
/* ═══════════════════════════════════════════════════════════════════
   4 · STORE — one database, one place that writes to it. Every write
   goes through mutate(), which stamps the audit trail, saves and redraws.
   ═══════════════════════════════════════════════════════════════════ */

const KEY = "meridian-pmo-db-v4";

/* Persistence adapter: the artifact host's storage when it exists, the
   browser's own store when the file is opened directly, memory otherwise. */
const Store = (() => {
  let mode = "memory", mem = null;
  return {
    async init() {
      if (typeof window !== "undefined" && window.storage && window.storage.get) { mode = "host"; return; }
      try { window.localStorage.setItem("__t", "1"); window.localStorage.removeItem("__t"); mode = "local"; }
      catch (e) { mode = "memory"; }
    },
    get mode() { return mode; },
    async load() {
      try {
        if (mode === "host") { const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        if (mode === "local") { const v = window.localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
        return mem;
      } catch (e) { return null; }
    },
    async save(db) {
      const text = JSON.stringify(db);
      try {
        if (mode === "host") await window.storage.set(KEY, text);
        else if (mode === "local") window.localStorage.setItem(KEY, text);
        else mem = JSON.parse(text);
      } catch (e) { mem = JSON.parse(text); }
    },
    async wipe() {
      try {
        if (mode === "host") await window.storage.delete(KEY);
        else if (mode === "local") window.localStorage.removeItem(KEY);
      } catch (e) { /* nothing to remove */ }
      mem = null;
    },
  };
})();

const App = {
  db: null,
  undoStack: [],
  ui: {
    view: "portfolio", param: null,
    scope: "all",              // programme id or "all"
    siteScope: "all",
    healthScope: "all",
    q: "",
    sort: { key: "name", dir: 1 },
    project: "PRJ-104",
    boardProject: "PRJ-101",
    boardAssignee: "",
    raidFilter: "All", raidCell: null,
    cr: "CR-218",
    ganttZoom: "month", ganttProject: "all",
    docFilter: "All",
    reportPeriod: null,
    sidebarOpen: false,
    dirty: false,
  },
  listeners: [],

  on(fn) { this.listeners.push(fn); },
  emit() { this.listeners.forEach(f => f()); },

  /** The single write path. */
  mutate(label, fn, opts) {
    const before = JSON.stringify(this.db);
    const res = fn(this.db);
    if (res === false) return false;
    this.undoStack.push({ label, snapshot: before });
    if (this.undoStack.length > 25) this.undoStack.shift();
    if (!(opts && opts.silent)) {
      this.db.audit.unshift({ id: uid(), at: new Date().toISOString(), who: this.db.currentUser, what: label, detail: (opts && opts.detail) || "" });
      if (this.db.audit.length > 400) this.db.audit.length = 400;
    }
    Store.save(this.db);
    this.emit();
    if (!(opts && opts.quiet)) toast(label, opts && opts.detail, opts && opts.warn);
    return true;
  },

  undo() {
    const last = this.undoStack.pop();
    if (!last) return toast("Nothing to undo");
    this.db = JSON.parse(last.snapshot);
    Store.save(this.db);
    this.emit();
    toast("Undone", last.label);
  },

  /** Session-only state: filters, selections, which pane is open. */
  set(patch) { Object.assign(this.ui, patch); this.emit(); },

  /* ── scoped selectors the views share ─────────────────────────── */
  scopedProjects() {
    const { scope, siteScope, healthScope, q } = this.ui;
    let list = this.db.projects.slice();
    if (scope !== "all") list = list.filter(p => p.programme === scope);
    if (siteScope !== "all") list = list.filter(p => p.site === siteScope);
    if (healthScope !== "all") list = list.filter(p => Engine.metrics(this.db, p.id).health.rag === healthScope);
    if (q) {
      const t = q.toLowerCase();
      list = list.filter(p => (p.name + " " + p.id + " " + Engine.personName(this.db, p.pm)).toLowerCase().includes(t));
    }
    return list;
  },
  scopeLabel() {
    const bits = [];
    if (this.ui.scope !== "all") bits.push((Engine.programme(this.db, this.ui.scope) || {}).name);
    if (this.ui.siteScope !== "all") bits.push((Engine.site(this.db, this.ui.siteScope) || {}).city);
    if (this.ui.healthScope !== "all") bits.push({ G: "Green", A: "Amber", R: "Red" }[this.ui.healthScope]);
    return bits.length ? bits.join(" · ") : "All programmes, all sites";
  },
};

/* ── toasts ───────────────────────────────────────────────────────── */
function toast(title, detail, warn) {
  const box = $("#toasts");
  const el = h("div", { class: "toast" + (warn ? " warn" : "") },
    h("div", { style: "flex:1" }, h("b", null, title), detail ? h("div", { class: "small", style: "opacity:.8;margin-top:2px" }, detail) : null),
    h("button", { class: "bare", "aria-label": "Dismiss", style: "opacity:.7", onClick: () => el.remove() }, icon("x", 13)));
  box.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, warn ? 5200 : 3400);
}

/* ── routing ──────────────────────────────────────────────────────── */
const ROUTES = ["portfolio", "project", "schedule", "board", "risk", "budget", "change", "resources", "documents", "reports", "locations", "admin"];
function go(hash) { location.hash = hash.startsWith("#") ? hash : "#/" + hash; }
function readRoute() {
  const raw = (location.hash || "#/portfolio").replace(/^#\/?/, "");
  const [view, param] = raw.split("/");
  const v = ROUTES.includes(view) ? view : "portfolio";
  App.ui.view = v;
  App.ui.param = param || null;
  if (v === "project" && param) App.ui.project = param;
  if (v === "change" && param) App.ui.cr = param;
  if (v === "board" && param) App.ui.boardProject = param;
  App.ui.sidebarOpen = false;
}

/* ── dialogs ──────────────────────────────────────────────────────── */
let openDialogs = 0;
function dialog({ title, kicker, body, actions, wide, onClose }) {
  const host = $("#overlay");
  const back = h("div", { class: "backdrop", role: "dialog", "aria-modal": "true", "aria-label": title });
  const close = () => { back.remove(); openDialogs--; if (onClose) onClose(); };
  back.addEventListener("mousedown", e => { if (e.target === back) close(); });
  const box = h("div", { class: "dialog" + (wide ? " wide" : "") },
    h("div", { class: "dialog-hd" },
      h("div", { class: "sp" },
        kicker ? h("div", { class: "kicker" }, kicker) : null,
        h("h4", { style: "margin-top:3px" }, title)),
      h("button", { class: "btn btn-ghost", "aria-label": "Close", onClick: close }, icon("x", 15))),
    h("div", { class: "dialog-bd" }, typeof body === "function" ? body(close) : body),
    actions ? h("div", { class: "dialog-ft" }, h("div", { class: "sp" }), ...actions(close)) : null);
  back.appendChild(box);
  host.appendChild(back);
  openDialogs++;
  const first = box.querySelector("input,select,textarea,button.btn-primary");
  if (first) setTimeout(() => first.focus(), 30);
  back.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); close(); } });
  return close;
}

function confirmDialog({ title, message, confirmLabel = "Confirm", danger, detail }) {
  return new Promise(resolve => {
    let settled = false;
    const done = (v) => { if (settled) return; settled = true; resolve(v); };
    const close = dialog({
      title, kicker: "Confirm",
      body: h("div", null,
        h("p", { style: "margin:0 0 8px" }, message),
        detail ? h("div", { class: "small muted" }, detail) : null),
      actions: (c) => [
        h("button", { class: "btn", onClick: () => { done(false); c(); } }, "Cancel"),
        h("button", { class: "btn " + (danger ? "btn-danger" : "btn-primary"), onClick: () => { done(true); c(); } }, confirmLabel),
      ],
      onClose: () => done(false),
    });
    return close;
  });
}

/* ── forms ────────────────────────────────────────────────────────── */
/**
 * Build a form from a field spec. Returns { el, read(), validate() }.
 * Field: { key, label, type, options, required, hint, span, min, max, step, rows }
 */
function form(fields, initial = {}) {
  const state = { ...initial };
  const nodes = {};
  const errs = {};

  const el = h("div", { class: "form-grid" }, ...fields.map(f => {
    const id = "f_" + f.key + "_" + Math.random().toString(36).slice(2, 6);
    let input;
    const val = state[f.key] ?? f.value ?? (f.type === "checkbox" ? false : "");
    const commit = (v) => { state[f.key] = v; if (f.onChange) f.onChange(v, state); };

    if (f.type === "select") {
      input = h("select", { class: "input", id, onChange: e => commit(e.target.value) },
        ...(f.options || []).map(o => {
          const value = typeof o === "string" ? o : o.value;
          const label = typeof o === "string" ? o : o.label;
          return h("option", { value, selected: String(value) === String(val) }, label);
        }));
      input.value = val;
    } else if (f.type === "textarea") {
      input = h("textarea", { class: "input", id, rows: f.rows || 3, value: val, onInput: e => commit(e.target.value) });
    } else if (f.type === "checkbox") {
      const wrap = h("label", { class: "checkline", for: id });
      const box = h("span", { class: "check" + (val ? " on" : "") });
      input = h("input", { type: "checkbox", id, checked: !!val, style: "position:absolute;opacity:0;width:0;height:0",
        onChange: e => { commit(e.target.checked); box.className = "check" + (e.target.checked ? " on" : ""); } });
      add(wrap, [input, box, h("span", null, h("span", { class: "strong" }, f.label), f.hint ? h("div", { class: "small muted" }, f.hint) : null)]);
      nodes[f.key] = input;
      return h("div", { class: f.span === 2 ? "full" : "" }, wrap);
    } else {
      input = h("input", { class: "input", id, type: f.type || "text", value: val,
        min: f.min, max: f.max, step: f.step, placeholder: f.placeholder,
        onInput: e => commit(f.type === "number" ? (e.target.value === "" ? "" : +e.target.value) : e.target.value) });
    }
    nodes[f.key] = input;
    const errEl = h("div", { class: "err", style: "display:none" });
    errs[f.key] = errEl;
    return h("div", { class: "field " + (f.span === 2 ? "full" : "") },
      h("label", { for: id }, f.label + (f.required ? " *" : "")),
      input,
      f.hint ? h("div", { class: "small muted" }, f.hint) : null,
      errEl);
  }));

  function validate() {
    let ok = true;
    fields.forEach(f => {
      const v = state[f.key];
      let msg = "";
      if (f.required && (v === "" || v === null || v === undefined)) msg = "Required";
      else if (f.type === "number" && v !== "" && f.min !== undefined && v < f.min) msg = "Minimum " + f.min;
      else if (f.type === "number" && v !== "" && f.max !== undefined && v > f.max) msg = "Maximum " + f.max;
      else if (f.validate) msg = f.validate(v, state) || "";
      if (errs[f.key]) {
        errs[f.key].textContent = msg;
        errs[f.key].style.display = msg ? "block" : "none";
      }
      if (nodes[f.key]) nodes[f.key].classList.toggle("invalid", !!msg);
      if (msg) ok = false;
    });
    return ok;
  }
  return { el, read: () => ({ ...state }), validate, nodes };
}

/** Convenience: a dialog wrapping a form with Save / Cancel. */
function formDialog({ title, kicker, fields, initial, saveLabel = "Save", onSave, wide, extra }) {
  const f = form(fields, initial);
  const close = dialog({
    title, kicker, wide,
    body: h("div", null, f.el, extra ? h("div", { style: "margin-top:16px" }, extra) : null),
    actions: (c) => [
      h("button", { class: "btn", onClick: c }, "Cancel"),
      h("button", { class: "btn btn-primary", onClick: () => { if (!f.validate()) return; if (onSave(f.read()) !== false) c(); } }, saveLabel),
    ],
  });
  return close;
}

/* ── tables ───────────────────────────────────────────────────────── */
/**
 * cols: [{ key, label, get(row)->node|string, sort(row)->comparable, align, width, th }]
 */
function table({ cols, rows, onRow, selected, empty, sortKey, sortDir, onSort, footer, rowClass }) {
  const thead = h("thead", null, h("tr", null, ...cols.map(c =>
    h("th", {
      class: (c.align === "r" ? "r " : c.align === "c" ? "c " : "") + (c.sort && onSort ? "sortable" : ""),
      style: c.width ? "width:" + c.width : null,
      onClick: c.sort && onSort ? () => onSort(c.key) : null,
      title: c.sort && onSort ? "Sort by " + c.label : null,
    }, c.label, c.sort && onSort && sortKey === c.key ? h("span", { class: "car" }, sortDir > 0 ? "▲" : "▼") : null))));

  const body = h("tbody", null, ...rows.map(r =>
    h("tr", {
      class: (onRow ? "click " : "") + (selected && selected(r) ? "sel " : "") + (rowClass ? rowClass(r) : ""),
      onClick: onRow ? (e) => { if (e.target.closest("button,a,input,select")) return; onRow(r); } : null,
      tabindex: onRow ? 0 : null,
      onKeydown: onRow ? (e) => { if (e.key === "Enter") onRow(r); } : null,
    }, ...cols.map(c => h("td", { class: c.align === "r" ? "r" : c.align === "c" ? "c" : "" }, c.get(r))))));

  if (!rows.length) {
    body.appendChild(h("tr", null, h("td", { colspan: cols.length },
      h("div", { class: "empty" },
        h("strong", null, (empty && empty.title) || "Nothing here yet"),
        (empty && empty.body) || "Adjust the filters, or add the first record."))));
  }
  return h("div", { class: "tbl-wrap" },
    h("table", { class: "table" }, thead, body, footer ? h("tfoot", null, footer) : null));
}

function sortRows(rows, cols, key, dir) {
  const col = cols.find(c => c.key === key);
  if (!col || !col.sort) return rows;
  return rows.slice().sort((a, b) => {
    const x = col.sort(a), y = col.sort(b);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * dir;
  });
}

/** Wire a sortable table to the shared ui.sort state. */
function sortableTable(opts) {
  const { key, dir } = App.ui.sort;
  const rows = sortRows(opts.rows, opts.cols, key, dir);
  return table({
    ...opts, rows, sortKey: key, sortDir: dir,
    onSort: (k) => App.set({ sort: { key: k, dir: k === key ? -dir : 1 } }),
  });
}

function sparkline(values, w = 120, hgt = 28, color) {
  if (!values.length) return h("span");
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * w, hgt - ((v - min) / span) * hgt]);
  return s("svg", { class: "sparkline", width: w, height: hgt, viewBox: `0 0 ${w} ${hgt}` },
    s("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none",

/** Planned / earned / actual money curve. */
function curveChart(series, w = 640, hgt = 190) {
  if (!series.length) return h("div", { class: "small muted" }, "No schedule to plot yet.");
  const pad = { l: 44, r: 8, t: 10, b: 22 };
  const iw = w - pad.l - pad.r, ih = hgt - pad.t - pad.b;
  const maxV = Math.max(...series.map(p => Math.max(p.pv || 0, p.ev || 0, p.ac || 0))) * 1.08 || 1;
  const x = i => pad.l + (i / Math.max(1, series.length - 1)) * iw;
  const y = v => pad.t + ih - (v / maxV) * ih;
  const line = (key, color, dash) => {
    const pts = series.map((p, i) => p[key] === null || p[key] === undefined ? null : [x(i), y(p[key])]).filter(Boolean);
    return pts.length < 2 ? null : s("polyline", { points: pts.map(p => p.join(",")).join(" "), fill: "none",
      stroke: color, "stroke-width": 2, "stroke-dasharray": dash || null });
  };
  const ticks = [0, 0.5, 1].map(f => {
    const v = maxV * f;
    return s("g", null,
      s("line", { x1: pad.l, x2: w - pad.r, y1: y(v), y2: y(v), stroke: "var(--rule-1)", "stroke-width": 1 }),
      s("text", { x: 0, y: y(v) + 4, "font-size": 9, fill: "var(--muted)", "font-family": "Archivo" }, "$" + v.toFixed(1) + "M"));
  });
  const labels = series.map((p, i) => (i % Math.ceil(series.length / 7) === 0)
    ? s("text", { x: x(i), y: hgt - 6, "font-size": 9, fill: "var(--muted)", "font-family": "Archivo", "text-anchor": "middle" },
        MONTHS[+p.period.slice(5, 7) - 1] + " " + p.period.slice(2, 4))
    : null).filter(Boolean);
  const todayIdx = series.findIndex(p => p.period >= monthKey(App.db.statusDate));
  return s("svg", { width: "100%", height: hgt, viewBox: `0 0 ${w} ${hgt}`, preserveAspectRatio: "xMidYMid meet", role: "img", "aria-label": "Planned, earned and actual value over time" },
    ...ticks, ...labels,
    todayIdx >= 0 ? s("line", { x1: x(todayIdx), x2: x(todayIdx), y1: pad.t, y2: pad.t + ih, stroke: "var(--color-accent)", "stroke-width": 2, "stroke-dasharray": "3 3" }) : null,
    line("pv", "var(--color-neutral-500)", "4 3"),
    line("ac", "var(--color-accent)"),
    line("ev", "var(--color-text)"));
}

/** Re-stretch a project's activities when its window moves. */
function rescheduleActivities(d, p) {
  const acts = d.activities.filter(a => a.project === p.id).sort(by("stage"));
  if (!acts.length) return;
  const tpl = WBS[p.method] || WBS.Hybrid;
  const span = days(p.start, p.finish);
  acts.forEach(a => {
    const t = tpl[a.stage] || tpl[tpl.length - 1];
    a.start = iso(addDays(p.start, Math.round(t.off * span)));
    a.end = iso(addDays(p.start, Math.round((t.off + t.dur) * span)));
  });
}

function setHealth(db, p) {
  const m = Engine.metrics(db, p.id);
  formDialog({
    title: "Set project status", kicker: p.id,
    fields: [
      { key: "mode", label: "Status source", type: "select", value: p.healthOverride ? "manual" : "auto",
        options: [{ value: "auto", label: "Derived from SPI and CPI" }, { value: "manual", label: "Set by the project manager" }] },
      { key: "rag", label: "Manual status", type: "select", value: p.healthOverride || m.health.rag,
        options: [{ value: "G", label: "Green" }, { value: "A", label: "Amber" }, { value: "R", label: "Red" }] },
      { key: "note", label: "Reason for the call", type: "textarea", span: 2, rows: 2, value: "" },
    ],
    extra: h("div", { class: "small muted" }, "Derived status right now: " + RAG_LABEL[m.health.rag] + " — " + m.health.why),
    saveLabel: "Set status",
    onSave: (v) => App.mutate("Project status set", d => {
      const t = d.projects.find(x => x.id === p.id);
      t.healthOverride = v.mode === "manual" ? v.rag : null;
    }, { detail: p.id + " → " + (v.mode === "manual" ? RAG_LABEL[v.rag] : "derived") + (v.note ? " · " + v.note : "") }),
